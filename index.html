<style>
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}em{font-style:normal}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--petrol);outline-offset:3px}
[hidden]{display:none!important}
img,svg{max-width:100%;height:auto;display:block}
html{scroll-behavior:smooth;overflow-x:hidden}
body{overflow-x:hidden;font-family:var(--body);font-weight:400;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* ── Tokens ── */
:root{
  --bg:#FAF7F2;
  --bg-card:#FFFFFF;
  --bg-soft:#F2EBE1;
  --primary:#1B485A;
  --primary-hover:#0A2E3D;
  --accent:#D97352;
  --accent-hover:#C56344;
  --accent-lt:#F9EFEA;
  --sage:#6B8E85;
  --sage-lt:#EDF3F1;
  --text:#1C2B33;
  --text-muted:#576A75;
  --border:#E8E1D7;
  --radius-card:24px;
  --radius-badge:999px;
  --primary-hover:#123340;
  --primary-lt:#EFF5F7;
  --accent-hover:#C46242;
  --max:1120px;
  --pad:clamp(20px,5vw,60px);
  --radius-sm:8px;
  --radius-md:16px;
  --radius-lg:24px;
  --radius-full:999px;
  --shadow-sm:0 4px 12px rgba(28,45,55,0.04);
  --shadow-md:0 12px 32px -8px rgba(28,45,55,0.08);
  --shadow-hover:0 20px 40px -10px rgba(28,45,55,0.14);
  --kopf:'Plus Jakarta Sans',system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,sans-serif;
  /* Kompatibilität */
  --head:var(--kopf);
  --bg2:var(--bg-soft);
  --ink:var(--text);
  --ink2:var(--text-muted);
  --rule:var(--border);
  --white:var(--bg-card);
  --petrol:var(--primary);
  --acc:var(--primary);
  --acc-lt:var(--accent-lt);
  --terracotta:var(--accent);
}

/* ── Nav ── */
.haupt-nav{position:fixed;top:0;left:0;right:0;z-index:999;background:#fff;box-shadow:0 1px 0 var(--rule)}
.nav-inner{max-width:var(--max);margin:0 auto;padding:0 var(--pad) 0 4px;display:flex;align-items:center;justify-content:space-between;height:88px}
.nav-logo{font-family:var(--head);font-size:18px;font-weight:400;color:var(--ink);text-decoration:none;letter-spacing:-0.01em}
.nav-logo span{color:var(--acc)}
.nav-links{display:flex;align-items:center;gap:6px;list-style:none}
.nav-links a{font-size:16px;font-weight:400;line-height:1.3;padding:10px 2px;white-space:nowrap;color:var(--ink2);text-decoration:none;letter-spacing:0.01em;transition:color 0.2s}
.nav-links a:hover{color:var(--ink)}
.nav-pill{background:var(--sand,#F5EFE6);border-radius:20px;padding:8px 14px!important;font-size:16px!important;color:var(--ink)!important;font-weight:500!important;white-space:nowrap;transition:background .2s,color .2s}
.nav-pill:hover{background:#EDE5D8!important;color:var(--ink)!important}
.nav-cta{background:var(--acc);color:#fff;font-size:13px;font-weight:500;padding:9px 20px;border-radius:2px;text-decoration:none;letter-spacing:0.02em;transition:opacity 0.2s}
.nav-cta:hover{opacity:0.85}
.burger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;border:none;background:transparent;color:var(--ink)}
.burger span{display:block;width:22px;height:1.5px;background:currentColor;transition:all 0.25s}
.burger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
.mob-nav{position:fixed;inset:119px 0 0;background:var(--bg);z-index:199;display:flex;flex-direction:column;padding:clamp(24px,5vw,40px) var(--pad);gap:0}
.mob-nav a{font-family:var(--head);font-size:22px;font-weight:400;color:var(--ink);text-decoration:none;border-bottom:0.5px solid var(--rule);padding:18px 0;display:block}
.mob-nav .mob-cta{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:500;background:var(--acc);color:#fff;text-align:center;padding:14px;margin-top:8px;letter-spacing:0.02em}

/* ── Hero ── */
.hero{background:var(--bg);padding:clamp(36px,4.5vw,60px) var(--pad) clamp(32px,4vw,52px)}
.hero-inner{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,5vw,72px);align-items:center}
.hero-h1{font-family:var(--head);font-size:clamp(32px,4.2vw,58px);font-weight:700;line-height:1.18;letter-spacing:-0.02em;color:var(--primary);margin-bottom:20px}
.hero-h1 em{color:var(--acc)}
.hero-sub{font-size:clamp(15px,1.4vw,17px);line-height:1.78;color:var(--ink2);font-weight:300;max-width:440px;margin-bottom:28px}
.hero-note{font-family:var(--head);font-size:clamp(13px,1.1vw,15px);color:var(--ink2);line-height:1.65;border-left:2px solid var(--acc);padding-left:16px;margin-bottom:36px;max-width:400px}
.hero-btns{display:flex;gap:14px;flex-wrap:nowrap}
.btn-primaer{background:var(--acc);color:#fff;font-size:14px;font-weight:500;padding:14px 26px;border-radius:2px;text-decoration:none;letter-spacing:0.02em;transition:opacity 0.2s}
.btn-primaer:hover{opacity:0.85}
.btn-sekundaer{background:transparent;color:var(--ink);font-size:14px;font-weight:400;padding:14px 26px;border:1px solid var(--rule);border-radius:2px;text-decoration:none;letter-spacing:0.02em;transition:background 0.2s}
.btn-sekundaer:hover{background:var(--bg2)}
.hero-visual{position:relative}
.hero-img-wrap{border-radius:4px;overflow:hidden;background:var(--bg2);aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;position:relative}
.hero-img-wrap picture,.hero-img-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:30% 8%}
.hero-img-ph{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--rule)}
.hero-img-ph svg{width:48px;height:48px;stroke:var(--rule)}
.hero-img-ph span{font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--rule)}
.hero-badge{position:absolute;bottom:-18px;right:-12px;background:var(--white);border:0.5px solid var(--rule);border-radius:3px;padding:14px 18px;box-shadow:0 4px 20px rgba(37,33,30,0.08)}
.hero-badge-val{font-family:var(--head);font-size:22px;font-weight:300;color:var(--ink);letter-spacing:-0.02em}
.hero-badge-lbl{font-size:14px;color:var(--ink2);letter-spacing:0.04em}

/* ── Quick Info ── */
.quickbar{background:var(--acc);padding:18px var(--pad)}
.quickbar-inner{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.qi-item{display:flex;align-items:center;gap:12px}
.qi-icon{width:36px;height:36px;background:rgba(255,255,255,0.12);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qi-icon svg{width:16px;height:16px;stroke:#fff;fill:none}
.qi-text{}
.qi-label{font-size:12px;color:rgba(255,255,255,0.9);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:2px}
.qi-val{font-size:13px;font-weight:500;color:#fff}

/* ── Vertrauen Bar ── */
.vbar{background:var(--white);border-bottom:0.5px solid var(--rule);padding:14px var(--pad)}
.vbar-inner{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:32px;justify-content:center;flex-wrap:wrap}
.vbar-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);letter-spacing:0.02em}
.vbar-dot{width:5px;height:5px;border-radius:50%;background:var(--acc);flex-shrink:0}

/* ── Section Shared ── */
.sek-inner{max-width:var(--max);margin:0 auto}
.sek-label{font-size:12px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
.sek-h2{font-family:var(--head);font-size:clamp(26px,3vw,42px);font-weight:700;letter-spacing:-0.02em;line-height:1.18;color:var(--primary);margin-bottom:16px}
.sek-sub{font-size:clamp(14px,1.3vw,16px);color:var(--ink2);line-height:1.8;font-weight:300;max-width:560px}

/* ── Haltung / Werte ── */
.haltung{padding:clamp(60px,7vw,96px) var(--pad);background:var(--white);border-bottom:0.5px solid var(--rule)}
.haltung-head{margin-bottom:clamp(40px,5vw,60px)}
.haltung-editorial{display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,6vw,80px);align-items:start}.haltung-right-list{display:flex;flex-direction:column;gap:0}.haltung-item{padding-bottom:28px;margin-bottom:28px;border-bottom:1px solid var(--border)}.haltung-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}

.haltung-nr{font-family:var(--head);font-size:clamp(32px,3.5vw,48px);font-weight:300;color:var(--rule);letter-spacing:-0.04em;line-height:1;margin-bottom:20px}
.haltung-h3{font-family:var(--head);font-size:clamp(17px,1.6vw,22px);font-weight:600;color:var(--primary);letter-spacing:-0.01em;margin-bottom:10px;line-height:1.2}
.haltung-p{font-size:16px;line-height:1.78;color:var(--ink2);font-weight:300}

/* ── Team ── */
.team{padding:clamp(60px,7vw,96px) var(--pad);background:var(--bg);border-bottom:0.5px solid var(--rule)}
.team-head{margin-bottom:clamp(40px,5vw,60px)}
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2.5rem}
.team-karte{background:transparent;border:none;border-radius:0;display:flex;flex-direction:column;text-align:center;padding:0.5rem 0.5rem 1.2rem;transition:transform .35s ease}
.team-foto{width:100%;aspect-ratio:1/1;height:auto;background:var(--bg-soft);border-radius:16px;overflow:hidden;margin:0 0 1.2rem 0;border:1px solid var(--border);box-shadow:none}.team-foto img{width:100%;height:100%;object-fit:cover;object-position:center 15%}
.team-foto-ph{display:flex;flex-direction:column;align-items:center;gap:8px}
.team-foto-ph svg{width:40px;height:40px;stroke:var(--rule)}
.team-foto-ph span{font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--rule)}
.team-body{padding:0 .5rem;x,2vw,26px);display:flex;flex-direction:column;flex:1}
.team-rolle{font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.team-name{font-family:var(--head);font-size:clamp(17px,1.6vw,21px);font-weight:700;color:var(--primary);letter-spacing:-0.01em;margin-bottom:10px;line-height:1.2}
.team-text{font-size:15px;line-height:1.72;color:var(--ink2);font-weight:300;margin-bottom:0}
.team-langs{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.team-personal{font-size:14px;line-height:1.65;color:var(--ink2);font-weight:300;margin-top:auto;padding-top:14px;border-top:0.5px solid var(--rule)}
.team-lang{font-size:12px;letter-spacing:0.06em;text-transform:uppercase;padding:3px 8px;border:0.5px solid var(--rule);color:var(--ink2)}


/* ── MFA Team ── */
.mfa-divider{width:100%;margin:clamp(32px,4vw,48px) auto 0;padding-top:clamp(24px,3vw,36px);border-top:0.5px solid var(--rule);display:flex;align-items:center;justify-content:center;gap:16px;padding-left:14%}
.mfa-label{font-size:12px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.mfa-grid{width:100%;margin:clamp(20px,2.5vw,28px) auto 0;display:flex;flex-wrap:wrap;justify-content:center;gap:1.5rem;padding-left:14%}
@media(max-width:1023px){.mfa-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.mfa-grid{grid-template-columns:repeat(2,1fr)}}
.mfa-card{background:transparent;border:none;border-radius:0;text-align:center;padding:0.8rem .5rem;transition:transform .35s ease;width:175px}
.mfa-foto{width:100%;aspect-ratio:1/1;height:auto;background:var(--bg-soft);border-radius:18px;overflow:hidden;margin:0 0 .8rem 0;border:1px solid var(--border);box-shadow:none}.mfa-foto img{width:100%;height:100%;object-fit:cover;object-position:center 20%}img[alt="Jennifer B."]{object-position:center bottom!important}
.mfa-body{padding:12px 14px}
.mfa-name{font-family:var(--head);font-size:15px;font-weight:400;color:var(--ink);letter-spacing:-0.01em;margin-bottom:3px}
.mfa-role{font-size:12px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink2)}

/* ── Leistungen Accordion ── */
.phasen{padding:clamp(60px,7vw,96px) var(--pad);background:var(--white);border-bottom:0.5px solid var(--rule)}
.phasen-head{margin-bottom:clamp(40px,5vw,60px)}
.ph-list{display:flex;flex-direction:column;gap:0;border-top:0.5px solid var(--rule)}
.ph-item{border-bottom:0.5px solid var(--rule)}
.ph-zurueck-card{display:none}
.mfa-zurueck-card{display:none}
.srv-zurueck-card{display:none}
.ek-zurueck-card{display:none}
.lv-chip-zurueck{display:none}
.lv-wischen-hint{display:none}.srv-swipe-hint{display:none}.ek-swipe-hint{display:none}.ph-swipe-hint{display:none}
.ph-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:clamp(18px,2.2vw,26px) 0;cursor:pointer;border:none;background:transparent;text-align:left;gap:16px;color:var(--ink);font-family:inherit}
.ph-btn:hover .ph-name{color:var(--acc)}
.ph-left{display:flex;align-items:center;gap:clamp(16px,2vw,28px)}
.ph-nr{display:none}
.ph-name-group{display:flex;flex-direction:column;gap:2px}
.ph-name{font-family:var(--head);font-size:clamp(16px,1.6vw,22px);font-weight:400;color:var(--ink);letter-spacing:-0.01em;transition:color 0.2s}
.ph-age{font-size:13px;color:var(--ink2);letter-spacing:0.02em}.ph-small{font-size:14px;color:var(--ink2);line-height:1.55;margin-top:3px;font-style:normal}
.ph-ico{stroke:var(--ink2);transition:transform 0.3s ease;flex-shrink:0}
.ph-btn[aria-expanded="true"] .ph-ico{transform:rotate(180deg)}
.ph-btn[aria-expanded="true"] .ph-name{color:var(--acc)}
.ph-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows 0.35s ease}
.ph-btn[aria-expanded="true"]+.ph-body{grid-template-rows:1fr}
.ph-bi{overflow:hidden}
.ph-bi-inner{padding:0 12px clamp(20px,2.5vw,32px) clamp(52px,4.5vw,64px)}
.ph-item:has(.ph-btn[aria-expanded="true"]){background:var(--acc-lt)}
.ph-btn[aria-expanded="true"]{padding-left:12px;padding-right:12px}
.ph-desc{font-size:17px;line-height:1.75;color:var(--ink2);margin-bottom:16px;font-weight:300;max-width:620px}
.ph-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.ph-erkl{margin:14px 0 16px;font-size:15px;line-height:1.55;color:var(--ink2)}
.ph-termin{display:inline-flex;margin-top:4px}
@media(max-width:767px){.ph-termin{width:100%;justify-content:center;text-align:center}}
.ph-tag{font-size:13px;padding:5px 11px;background:var(--bg);color:var(--ink2);border:0.5px solid var(--rule);letter-spacing:0.01em}
.ph-ext-link{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--acc);text-decoration:none;letter-spacing:0.01em;margin-top:6px}
.ph-ext-link:hover{text-decoration:underline}

/* ── Kontakt + Anfahrt (kombiniert) ── */
.kontakt-bereich{padding:clamp(40px,5vw,60px) var(--pad);background:var(--bg);border-bottom:0.5px solid var(--rule)}
.kontakt-grid{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:clamp(24px,4vw,56px)}
.k-col-head{font-size:12px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:18px;padding-bottom:10px;border-bottom:0.5px solid var(--rule)}
.k-block{margin-bottom:16px}
.k-lbl{font-size:14px;letter-spacing:0.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:4px}
.k-val{font-size:16px;color:var(--ink);line-height:1.55;font-weight:300}
.k-val a{color:var(--ink);text-decoration:none}
.k-val a:hover{color:var(--acc)}
.k-val.sm{font-size:14px}
.k-cta{display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:#fff;font-size:13px;font-weight:500;padding:10px 18px;text-decoration:none;letter-spacing:0.04em;transition:opacity 0.2s;margin-top:4px}
.k-cta:hover{opacity:0.85}
.oz-table{width:100%;border-collapse:collapse}
.oz-tr th{font-size:14px;font-weight:400;color:var(--ink);text-align:left;padding:7px 0;border-bottom:0.5px solid var(--rule);white-space:nowrap;padding-right:16px}
.oz-tr td{font-size:14px;color:var(--ink2);text-align:right;padding:7px 0;border-bottom:0.5px solid var(--rule);font-weight:300}
.oz-tr.heute th,.oz-tr.heute td{color:var(--acc);font-weight:500}
.heute-pill{display:none;margin-left:6px;font-size:12px;background:var(--acc);color:#fff;padding:2px 5px;letter-spacing:0.04em}
.oz-tr.heute .heute-pill{display:inline}
.oz-note{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.6}
.oz-note a{color:var(--acc);text-decoration:none}
.anfahrt-list{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:4px}
.anfahrt-list li{font-size:14px;color:var(--ink2);line-height:1.6;font-weight:300;padding-left:12px;position:relative}
.anfahrt-list li::before{content:"";position:absolute;left:0;top:7px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
.map-btn{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--acc);text-decoration:none;padding:9px 14px;border:1px solid var(--acc);margin-top:14px;font-weight:400}
.map-btn:hover{background:var(--acc-lt)}
@media(max-width:1023px){.kontakt-grid{grid-template-columns:1fr 1fr}}
@media(max-width:767px){
  .praxis-grid{grid-template-columns:1fr}
  .hero-frame{max-width:100%}
  .hero-floating-card{left:-10px;bottom:-12px}
  .praxis-karte--gross .praxis-bild-wrap{aspect-ratio:4/3}.kontakt-grid{grid-template-columns:1fr}}


/* ── Footer ── */
footer{background:var(--primary);padding:clamp(48px,5vw,72px) var(--pad)}
.footer-i{max-width:var(--max);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.footer-logo{font-family:var(--head);font-size:15px;font-weight:300;color:rgba(255,255,255,0.5);letter-spacing:-0.01em}
.footer-links{display:flex;gap:24px;list-style:none}
.footer-links a{font-size:14px;color:rgba(255,255,255,0.75);text-decoration:none;letter-spacing:0.02em;transition:color 0.2s}
.footer-links a:hover{color:rgba(255,255,255,0.9)}
.footer-copy{font-size:14px;color:rgba(255,255,255,0.6);letter-spacing:0.02em}

/* ── Praxis-Fakten Strip ── */
.praxis-fakten{padding:clamp(48px,5.5vw,72px) var(--pad);background:var(--bg);border-bottom:0.5px solid var(--rule)}
.pf-raster{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(24px,3vw,40px);margin-bottom:32px}
.pf-item{display:flex;flex-direction:column;gap:14px}
.pf-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:0.5px solid var(--rule);border-radius:2px;flex-shrink:0}

/* ── Hero V2 · Editorial, warm, trustworthy ── */

.nav-inner{height:82px;max-width:var(--max)}
.nav-logo{font-size:20px}
.nav-links{gap:16px}
.nav-cta{background:var(--accent);border-radius:999px;padding:11px 22px}

.hero.hero-v2{
  min-height:min(70vh, 560px);
  background:#fcfbf9;
  display:grid;
  grid-template-columns:1.15fr 0.85fr;
  position:relative;
  overflow:hidden;
  padding:0;
  background:var(--bg);
}
.hero.hero-v2::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0}
.hero-v2 .hero-inner{
  display:contents;
}
.hero-copy{
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:clamp(48px,6vw,80px) clamp(28px,4.5vw,64px);
  position:relative;
  z-index:3;
  background:linear-gradient(135deg,#FDF8F2 0%,#FAF7F2 100%);
}
.hero-v2 .sek-label{color:var(--petrol);margin-bottom:22px}
.hero-eyebrow-line{display:flex;align-items:center;gap:12px}
.hero-tag{display:inline-block;font-size:13px;color:var(--petrol);background:var(--acc-lt);padding:6px 14px;border-radius:999px;margin-bottom:12px;font-weight:500}
.hero-welcome{font-size:14px;font-weight:500;color:var(--terracotta);letter-spacing:0.04em;text-transform:uppercase;margin-bottom:8px}

.hero-eyebrow-line::before{content:"";width:34px;height:1px;background:var(--terracotta)}
.hero-v2 .hero-h1{font-family:var(--head);font-weight:700;line-height:1.16;letter-spacing:-0.025em;font-size:clamp(34px,3.8vw,50px);color:var(--primary);margin-bottom:24px}
.hero-v2 .hero-h1 span{display:block}
.hero-v2 .hero-h1 em{font-style:italic;font-weight:600;color:var(--accent);display:block;padding-right:0}
.h1-s1{display:block;padding-left:clamp(20px,2.8vw,44px)}
.h1-s2{display:block;padding-left:clamp(44px,5.5vw,88px);margin-top:2px}
.hero-v2 .hero-sub{
  font-size:clamp(16px,1.5vw,19px);
  line-height:1.78;
  color:var(--text-muted);
  max-width:490px;
  margin-bottom:34px;
}
.hero-v2 .hero-btns{gap:12px;align-items:center}
.hero-v2 .btn-primaer{
  background:var(--petrol);
  border-radius:999px;
  padding:16px 27px;
  box-shadow:0 12px 30px rgba(32,73,74,.16);
  transition:transform .22s ease,box-shadow .22s ease,opacity .2s;
}
.hero-v2 .btn-primaer:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(32,73,74,.20)}
.hero-v2 .btn-sekundaer{
  border:none;
  padding:15px 10px;
  border-radius:0;
  position:relative;
}
.hero-v2 .btn-sekundaer::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--terracotta);transform:scaleX(0);transform-origin:left;transition:transform .28s ease}
.hero-v2 .btn-sekundaer:hover{background:transparent}
.hero-v2 .btn-sekundaer:hover::after{transform:scaleX(1)}

.hero-v2 .hero-visual{padding:0;position:relative;display:flex;align-items:center;justify-content:center}
.hero-frame{position:relative;width:100%;max-width:480px;padding:0;border-radius:20px;overflow:hidden;box-shadow:0 24px 64px rgba(28,43,51,0.13)}
.hero-img-box{width:100%;aspect-ratio:4/5;height:auto;border-radius:0;overflow:hidden;position:relative;background:var(--bg-soft)}
.hero-img-box img{width:100%;height:100%;object-fit:cover;object-position:center 15%;animation:hero-kenburns 14s ease-in-out infinite alternate;transform-origin:center 20%}@keyframes hero-kenburns{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.06) translate(-1%,1%)}}
.hero-floating-card{position:absolute;bottom:24px;left:-32px;background:var(--white);border:1px solid var(--rule);padding:14px 20px;border-radius:16px;box-shadow:0 12px 32px rgba(28,45,55,0.12);display:flex;align-items:center;gap:10px;z-index:4;max-width:320px}
.hero-floating-card img{width:40px;height:40px;border-radius:8px;object-fit:cover;flex-shrink:0}
.hero-floating-text strong{display:block;font-family:var(--head);font-size:13.5px;color:var(--ink);font-weight:400;white-space:nowrap}
.hero-floating-text span{font-size:12px;color:var(--ink2)}
.hero-scene{display:none!important}
.hero-scene svg{width:100%;height:100%;opacity:.73}
.hero-img-badge{position:absolute;left:18px;bottom:18px;z-index:3;display:none;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.85);background:rgba(37,33,30,.45);backdrop-filter:blur(8px);padding:7px 12px;border-radius:999px}

.hero-usp-badge{display:inline-flex;align-items:center;gap:8px;background:var(--acc-lt);border:1px solid rgba(122,92,56,.18);padding:8px 14px;border-radius:2px;margin-bottom:18px}
.hero-usp-badge span{font-size:12px;font-weight:500;color:var(--acc);letter-spacing:.05em}
.hero-usp-badge svg{width:13px;height:13px;stroke:var(--acc);flex-shrink:0}


@media(max-width:1023px){
  .hero.hero-v2{min-height:auto;grid-template-columns:1fr}
  .hero-v2 .hero-inner{display:contents}
  .hero-copy{order:2;padding:36px clamp(22px,5vw,48px) 52px}
  .hero-v2 .hero-visual{order:1;min-height:62vw}
  .hero-v2 .hero-img-wrap{position:relative;height:62vw;border-radius:12px;inset:unset;box-shadow:none}
  .hero-v2 .hero-img-wrap::before{background:linear-gradient(to bottom,transparent 0%,rgba(249,245,240,.7) 80%,#F9F5F0 100%)}
  .hero-v2 .hero-h1{font-size:clamp(28px,4.5vw,38px)}
}
@media(max-width:767px){
  .nav-inner{height:56px}
  .haupt-nav{top:0}
  .hero-v2 .hero-h1{font-size:clamp(26px,7.5vw,34px);line-height:1.15}
  .hero-v2 .hero-sub{font-size:15px}
  .hero-v2 .hero-visual{min-height:55vw}
  .hero-v2 .hero-img-wrap{height:55vw;border-radius:12px}
}

/* ── Mobile ≤480px: Hero-Buttons untereinander (nur Smartphones) ── */

/* ── Kontakt CTA-Boxes ── */
.kontakt-cta{max-width:var(--max);margin:0 auto clamp(40px,5vw,60px);display:grid;grid-template-columns:1fr 1fr;gap:clamp(16px,2vw,24px)}

.kcta-box.kcta-online{background:var(--petrol)}

.kcta-akut .kcta-pill{background:var(--acc-lt);color:var(--acc)}
.kcta-h{font-family:var(--head);font-size:clamp(17px,1.6vw,21px);font-weight:400;letter-spacing:-.01em;margin-bottom:8px}

.kcta-akut .kcta-h{color:var(--ink)}

.kcta-btn{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;padding:12px 22px;text-decoration:none;letter-spacing:.02em;border-radius:999px;transition:opacity .2s}

.kcta-akut .kcta-btn{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.kcta-btn:hover{opacity:.82}
@media(max-width:767px){.kontakt-cta{grid-template-columns:1fr}}

/* ── Digitale Services ── */
.digitalservices{padding:clamp(60px,7vw,96px) var(--pad);background:var(--bg2);border-bottom:0.5px solid var(--rule)}
.ds-head{margin-bottom:clamp(40px,5vw,56px)}
.ds-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,28px)}
.dienst-karte{background:var(--bg);border:0.5px solid var(--rule);padding:clamp(24px,3vw,36px);display:flex;flex-direction:column}
.ds-icon{width:44px;height:44px;border-radius:50%;background:var(--acc-lt);display:flex;align-items:center;justify-content:center;margin-bottom:20px;flex-shrink:0}

.ds-h3{font-family:var(--head);font-size:clamp(17px,1.6vw,21px);font-weight:400;color:var(--ink);letter-spacing:-.01em;margin-bottom:10px;line-height:1.2}
.ds-p{font-size:15px;line-height:1.78;color:var(--ink2);font-weight:300;flex:1;margin-bottom:22px}
.ds-btn{cursor:pointer;font-family:var(--body);display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--petrol);text-decoration:none;border:1px solid var(--petrol);padding:10px 18px;border-radius:999px;letter-spacing:.02em;transition:background .2s,color .2s;align-self:flex-start;margin-top:auto}

/* ── Elternbereich ── */
.elternbereich{padding:clamp(60px,7vw,96px) var(--pad);background:var(--bg);border-bottom:0.5px solid var(--rule)}
.eltern-inner{max-width:var(--max);margin:0 auto}

/* Login-Box */
.eltern-login{max-width:480px;margin:0 auto;text-align:center}
.eltern-login-card{background:var(--white,#fff);border:0.5px solid var(--rule);border-radius:16px;padding:clamp(32px,4vw,52px);box-shadow:0 8px 40px rgba(30,41,59,.07)}
.eltern-login-icon{width:52px;height:52px;background:var(--acc-lt);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.eltern-login-icon svg{width:22px;height:22px;stroke:var(--petrol);fill:none;stroke-width:1.5}
.eltern-login-h{font-family:var(--head);font-size:clamp(20px,2vw,26px);font-weight:400;color:var(--ink);letter-spacing:-.01em;margin-bottom:10px}
.eltern-login-sub{font-size:14px;line-height:1.72;color:var(--ink2);font-weight:300;margin-bottom:28px}
.eltern-input{width:100%;padding:13px 16px;border:1px solid var(--rule);border-radius:8px;font-size:15px;font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);background:var(--bg);outline:none;transition:border-color .2s;letter-spacing:.05em}

/* Infothek (nach Login) */
.eltern-content{display:none}
.eltern-content-head{margin-bottom:clamp(36px,4vw,52px)}
.eltern-unlock-badge{display:inline-flex;align-items:center;gap:8px;background:var(--acc-lt);padding:6px 14px;border-radius:999px;margin-bottom:16px}
.eltern-unlock-badge span{font-size:12px;font-weight:500;color:var(--petrol);letter-spacing:.05em}
.eltern-unlock-badge svg{width:12px;height:12px;stroke:var(--petrol);fill:none;stroke-width:2}
.eltern-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,28px)}

.eltern-col-h{font-family:var(--head);font-size:clamp(15px,1.4vw,18px);font-weight:400;color:var(--ink);letter-spacing:-.01em;margin-bottom:16px;padding-bottom:12px;border-bottom:0.5px solid var(--rule)}
.eltern-col ul{list-style:none;display:flex;flex-direction:column;gap:9px}

.eltern-col a{color:var(--petrol);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
.eltern-col a:hover{border-bottom-color:var(--petrol)}
.eltern-praxistipp{background:var(--acc-lt);border:0.5px solid var(--acc-lt);padding:clamp(18px,2vw,26px);font-size:14px;line-height:1.75;color:var(--ink);font-weight:300}
.eltern-praxistipp strong{font-weight:500;color:var(--petrol);display:block;margin-bottom:8px}
@media(max-width:767px){.eltern-grid{grid-template-columns:1fr}}
@media(max-width:1023px) and (min-width:768px){.eltern-grid{grid-template-columns:1fr 1fr}}

/* ── Sprachen-Bar ── */
.lang-bar{height:34px;display:flex;align-items:center;background:#fff;border-bottom:0.5px solid var(--rule);padding:0 var(--pad)}
.lang-bar-inner{width:100%;max-width:var(--max);margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}

.btn-tel-hero{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--primary);text-decoration:none;padding:13px 20px;border:1.5px solid var(--border);border-radius:var(--radius-full);background:#fff;transition:border-color .2s}

.hero-erst-besuch{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:13px;color:var(--text-muted)}
.hero-eb-label{font-weight:600;color:var(--text)}
.hero-eb-link{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(217,115,82,.35)}
.hero-eb-link:hover{border-color:var(--accent)}
.praxis-einblick{padding:clamp(40px,5vw,64px) var(--pad);background:var(--bg-soft)}
.pe-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:20px}
.pe-kachel img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;filter:saturate(0.85) contrast(1.04)}
.pe-kachel img:hover{filter:saturate(1) contrast(1);transition:filter .3s}
.puppen-spot-inner{max-width:860px;margin:0 auto;text-align:center}
.puppen-spot-inner img{width:100%;max-width:700px;height:auto;border-radius:16px;margin:0 auto}
.puppen-caption{margin-top:18px;font-size:14px;color:var(--text-muted);font-style:italic;letter-spacing:0.01em}
.team-karte--ph{opacity:1}.team-foto-ph-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;width:100%;height:100%}
.team-foto--leer{background:var(--bg-soft);border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;aspect-ratio:1/1}
.team-foto-coming{font-size:12px;color:var(--text-muted);letter-spacing:0.05em;text-transform:uppercase}
.uj-title{font-size:12px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px}
.uj-items{display:flex;flex-direction:column;gap:10px}
.uj-item{display:flex;align-items:baseline;gap:14px}
.uj-kuerzel{font-family:var(--kopf);font-size:13px;font-weight:700;color:var(--primary);min-width:72px;flex-shrink:0}

/* ── Info-Kacheln (Sprechzeiten / Telefon / Akut) ── */
.info-kacheln{padding:clamp(32px,4vw,52px) var(--pad);background:var(--bg-card);border-bottom:1px solid var(--border)}
.info-kacheln-grid{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(16px,2vw,28px)}
.info-kachel{padding:clamp(22px,2.5vw,32px);background:var(--bg);border-radius:var(--radius-md);border:1px solid var(--border)}
.info-kachel.kachel-akut{background:var(--accent-lt);border-color:rgba(217,119,87,0.25)}
.info-kachel-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:20px;background:var(--sage-lt)}
.info-kachel-h{font-family:var(--kopf);font-size:clamp(15px,1.4vw,18px);font-weight:400;color:var(--text);margin-bottom:8px;letter-spacing:-0.01em}
.info-kachel-p{font-size:14px;line-height:1.72;color:var(--text-muted)}
.info-kachel-zeiten{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.info-kachel-zeile{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:6px 0;border-bottom:0.5px solid var(--border)}
.info-kachel-zeile:last-child{border-bottom:none}
.info-kachel-zeile .tag{color:var(--text);font-weight:400}
.info-kachel-zeile .zeit{color:var(--text-muted)}
.info-kachel-tel{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-size:15px;font-weight:500;color:var(--primary);text-decoration:none}
.info-kachel-tel:hover{color:var(--primary-hover)}
@media(max-width:767px){.info-kacheln-grid{grid-template-columns:1fr;gap:12px}}
@media(max-width:1024px) and (orientation:portrait){.info-kacheln-grid{grid-template-columns:1fr}}

/* ── Philosophie-Sektion ── */
.philosophie{padding:clamp(60px,7vw,96px) var(--pad);background:var(--bg-soft);border-bottom:1px solid var(--border)}
.philosophie-inner{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(40px,6vw,80px);align-items:center}
.philosophie-bild{border-radius:var(--radius-lg);overflow:hidden;aspect-ratio:4/3;background:var(--border)}
.philosophie-bild img{width:100%;height:100%;object-fit:cover;display:block}
.phil-punkte{margin-top:24px;display:flex;flex-direction:column;gap:14px}
.phil-punkt{display:flex;align-items:flex-start;gap:14px}
.phil-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px;flex-shrink:0}
.phil-punkt p{font-size:15px;line-height:1.75;color:var(--text-muted)}
@media(max-width:767px){.philosophie-inner{grid-template-columns:1fr}}
@media(max-width:1024px) and (orientation:portrait){.philosophie-inner{grid-template-columns:1fr}}

/* ── Footer erweitert ── */
.footer-cols{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr;gap:clamp(24px,4vw,56px);margin-bottom:clamp(32px,4vw,48px)}
.footer-col-h{font-size:11px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;color:rgba(255,255,255,0.45);margin-bottom:14px;padding-bottom:10px;border-bottom:0.5px solid rgba(255,255,255,0.1)}
.footer-col{display:flex;flex-direction:column;gap:0}
.footer-praxis-name{font-family:var(--kopf);font-size:15px;font-weight:600;color:rgba(255,255,255,0.90);line-height:1.4;margin-bottom:10px}
.footer-adresse{font-size:13px;color:rgba(255,255,255,0.55);line-height:1.7;margin-bottom:10px}
.footer-tel{font-size:20px;font-weight:700;color:#fff;text-decoration:none;letter-spacing:-0.02em;margin-bottom:8px;display:block}
.footer-tel:hover{color:var(--accent)}
.footer-anfahrt{font-size:12px;color:rgba(255,255,255,0.38);line-height:1.6;margin-bottom:20px}
.footer-bottom{border-top:0.5px solid rgba(255,255,255,0.08);padding:18px var(--pad);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.footer-bottom p{font-size:12px;color:rgba(255,255,255,0.45)}
.footer-bottom a{color:rgba(255,255,255,0.55);text-decoration:none}
.footer-bottom a:hover{color:rgba(255,255,255,0.8)}
.footer-pe{display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,0.55);text-decoration:none;font-size:12px;letter-spacing:0.01em;border:0.5px solid rgba(255,255,255,0.12);border-radius:20px;padding:3px 10px 3px 6px;transition:border-color .2s,color .2s}
.footer-pe:hover{border-color:rgba(255,255,255,0.3);color:rgba(255,255,255,0.85)!important}
.footer-pe-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;opacity:0.85}
.footer-notfall{margin-top:16px;padding:14px 16px;background:rgba(255,255,255,0.07);border-radius:var(--radius-sm);border:0.5px solid rgba(255,255,255,0.12)}
.footer-notfall-lbl{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:8px}
.footer-notfall-nums{display:flex;flex-direction:column;gap:5px}
.footer-notfall-num{font-size:14px;color:rgba(255,255,255,0.7)}
.footer-notfall-num a{color:rgba(255,255,255,0.85);text-decoration:none;font-weight:500}
.footer-notfall-num a:hover{color:#fff}
.footer-col-links{list-style:none;display:flex;flex-direction:column;gap:8px}
.footer-col-links a{font-size:14px;color:rgba(255,255,255,0.6);text-decoration:none;transition:color .2s}
.footer-col-links a:hover{color:rgba(255,255,255,0.9)}
.footer-col-text{font-size:14px;color:rgba(255,255,255,0.55);line-height:1.7;margin-bottom:6px}
.footer-bottom{max-width:var(--max);margin:0 auto;padding-top:24px;border-top:0.5px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
@media(max-width:767px){.footer-cols{grid-template-columns:1fr;gap:28px}.footer-bottom{flex-direction:column;align-items:flex-start}}
@media(min-width:768px) and (max-width:1024px) and (orientation:portrait){.footer-cols{grid-template-columns:1fr 1fr}}
.team-karte:hover{transform:translateY(-3px)}
.mfa-card:hover{transform:translateY(-2px)}
.usp-item:hover{transform:translateY(-3px)}
.usp-item{transition:transform .35s ease}

.welcome-badge{display:inline-flex;align-items:center;gap:6px;background:var(--terracotta);color:#fff;font-size:12px;font-weight:500;letter-spacing:.04em;padding:5px 12px;border-radius:999px;margin-bottom:14px;opacity:.92}
.welcome-dot{width:5px;height:5px;border-radius:50%;background:#fff;opacity:.8}

/* ═══════════════════════════════════════════════════════
   SMARTPHONE-OPTIMIERUNG — Conversion + Wärme + Daumen
   ═══════════════════════════════════════════════════════ */

/* ── Sticky Bottom Action Bar ── */
.mobil-dock{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  z-index:888;
  background:#fff;
  border-top:0.5px solid var(--rule);
  box-shadow:0 -6px 24px rgba(30,41,59,.12);
  padding-bottom:env(safe-area-inset-bottom,0px);
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.4,0,.2,1);
}
.mobil-dock.dock-sichtbar{transform:translateY(0)}
.dock-inner{display:grid;grid-template-columns:1fr 1fr}
.dock-anruf{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:0 12px;min-height:56px;
  background:#fff8f7;color:#B91C1C;
  font-size:14px;font-weight:500;letter-spacing:.02em;
  text-decoration:none;
  border-right:0.5px solid var(--rule);
  -webkit-tap-highlight-color:transparent;
}
.dock-anruf svg{width:17px;height:17px;stroke:currentColor;fill:none;flex-shrink:0}
.dock-termin{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:0 12px;min-height:56px;
  background:var(--petrol);color:#fff;
  font-size:14px;font-weight:500;letter-spacing:.02em;
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
}
.dock-termin svg{width:17px;height:17px;stroke:#fff;fill:none;flex-shrink:0}

/* Mobile: Hero-Bild zwischen H1 und Sub-Text */
.hero-mob-visual{display:none}
/* Wisch-Hinweise nur auf Smartphone */
.team-carousel-hint,.mfa-carousel-hint{display:none}

/* ── PORTRAIT (Hochformat) ≤ 767px ── */
@media(max-width:767px){
  /* Sticky Bar einschalten */
  .mobil-dock{display:block}

  /* Mascot/Männlein-Weiblein im Nav ausblenden */
  .nav-inner picture{ display:none !important }

  /* Mob-Nav: richtige Höhe + kleinere Schrift */
  .mob-nav{ inset:56px 0 0 }
  .mob-nav a{ font-size:16px; padding:13px 0 }
  .mob-nav .mob-cta{ font-size:14px; padding:13px }

  /* Body padding — kein Inhalt unter der Bar */
  body{padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}

  /* ── HERO MOBILE: Bild als echter Hintergrund ── */

  .hero.hero-v2{
    background-image:url('bilder/hero.webp') !important;
    background-size:cover !important;
    background-position:center 50% !important;
    background-color:#F9F5F0 !important;
    display:flex !important;
    flex-direction:column;
    justify-content:flex-end;
    position:relative;
    overflow:hidden;
    min-height:82vh;
    padding:0;
    height:auto;
  }

  /* Kein Pseudo-Bild */
  .hero.hero-v2::after{ display:none }

  /* Leichter Gradient für Lesbarkeit */
  .hero.hero-v2::before{
    content:"";
    position:absolute; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(to bottom,
      rgba(0,0,0,0.00) 0%,
      rgba(0,0,0,0.06) 60%
    );
  }

  /* hero-inner: Card nach unten schieben */
  .hero-v2 .hero-inner{
    position:relative;
    z-index:2;
    width:100%;
    height:auto;
  }

  /* Desktop-Visual ausblenden */
  .hero-mob-visual{ display:none !important; }
  .hero-v2 .hero-visual{ display:none }
  .hero-usp-badge,.welcome-badge{ display:none }

  /* Card: klebt am unteren Rand, Glassmorphism */
  .hero-copy{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    padding:22px 20px 28px;
    gap:0;
    background:rgba(252,248,244,0.72);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border-radius:16px 16px 0 0;
    border-top:3px solid var(--accent);
    margin:0;
  }

  .hero-eyebrow-line{
    color:#3B5E4F;
    font-size:12px;
    letter-spacing:0.06em;
    padding:0 0 2px;
    margin:0;
  }
  .hero-eyebrow-line::before{ background:#3B5E4F }

  .hero-v2 .hero-h1{
    color:var(--ink);
    font-size:22px;
    line-height:1.3;
    margin:0 0 6px;
    padding:0;
  }
  .hero-v2 .hero-h1 em{ font-size:22px }
  .hero-v2 .hero-h1 span{ font-size:22px }

  .hero-sub{
    color:var(--ink);
    font-size:13px;
    line-height:1.4;
    margin:0 0 12px;
    padding:0;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .hero-v2 .hero-btns{
    flex-direction:column;
    align-items:stretch;
    gap:0; padding:0; margin:0;
  }
  /* CTA volle Breite */
  .hero-v2 .btn-primaer{
    display:flex !important;
    width:100%;
    text-align:center;
    justify-content:center;
    padding:14px 20px;
    font-size:15px;
    font-weight:600;
    border-radius:10px;
    min-height:48px;
    background:#1B485A;
    color:#fff;
    box-shadow:0 3px 10px rgba(27,72,90,0.18);
    margin-bottom:10px;
  }
  .hero-v2 .btn-primaer:active{ background:#133649; transform:scale(0.98) }
  /* Videosprechstunde: Textlink */
  .hero-v2 .btn-sekundaer{
    display:block !important;
    background:transparent !important;
    border:none !important;
    box-shadow:none !important;
    color:var(--primary);
    text-decoration:underline;
    text-underline-offset:3px;
    text-align:center;
    padding:6px 0;
    font-size:14px;
    font-weight:500;
  }

  .hero-akut-hint{
    color:#555555;
    font-size:12px;
    padding:0; margin:4px 0 0;
    text-align:center;
    margin-bottom:0;
  }

    /* Team: horizontales Wisch-Karussell */
  .team-grid{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    gap:14px;
    padding-bottom:16px;
    cursor:grab;
    scrollbar-width:none;
  }
  .team-grid::-webkit-scrollbar{display:none}
  .team-grid .team-karte{
    flex:0 0 82vw;
    max-width:320px;
    scroll-snap-align:start;
    border-radius:16px;
  }
  /* Karussell-Hinweis */
  .team-carousel-hint{
    font-size:12px;color:var(--ink2);
    margin-top:-8px;margin-bottom:16px;
    display:flex;align-items:center;gap:6px;opacity:.7;
  }
  .team-carousel-hint svg{width:14px;height:14px;stroke:currentColor;fill:none;flex-shrink:0}

  /* MFA-Wisch-Hinweis */
  .mfa-carousel-hint{
    display:flex;
    font-size:12px;color:var(--ink2);
    margin-top:12px;margin-bottom:10px;
    align-items:center;gap:6px;opacity:.7;
  }

  /* MFA: horizontales Karussell */
  .mfa-grid{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    gap:12px;
    padding-bottom:12px;
    scrollbar-width:none;
    grid-template-columns:unset;
  }
  .mfa-grid::-webkit-scrollbar{display:none}
  .mfa-grid .mfa-card{
    flex:0 0 44vw;
    max-width:190px;
    scroll-snap-align:start;
  }

  /* Öffnungszeiten: Tabelle → Flex-Blöcke */
  .oz-table{display:block}
  .oz-table thead{display:none}
  .oz-table tbody{display:flex;flex-direction:column;gap:0}
  .oz-tr{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 0;
    border-bottom:0.5px solid var(--rule);
  }
  .oz-tr th,.oz-tr td{
    display:block;
    padding:0;border:none;
    font-size:15px;white-space:nowrap;
  }
  .oz-tr th{font-weight:400;color:var(--ink)}
  .oz-tr td{text-align:right;color:var(--ink2)}
  .oz-tr.heute th{color:var(--petrol);font-weight:600}
  .oz-tr.heute td{color:var(--petrol);font-weight:500}

  /* Kontakt: gestapelt */
  .kontakt-grid{grid-template-columns:1fr}
  .kontakt-cta{grid-template-columns:1fr}

  /* Quickbar */
  .quickbar-inner{grid-template-columns:1fr;gap:14px}

  /* Haltung */
  .haltung-editorial{grid-template-columns:1fr}

  /* Digitale Services */
  .ds-grid{grid-template-columns:1fr}

  /* Praxisfakten */
  .pf-raster{grid-template-columns:1fr 1fr}

  /* ds-btn: volle Breite auf Handy */
  .ds-btn{cursor:pointer;font-family:var(--body);width:100%;justify-content:center;padding:14px 20px;font-size:15px;min-height:48px}

  /* Touch-Targets: alle Buttons mind. 48px */
  .k-cta,.map-btn,.kcta-btn,.nav-cta{min-height:48px;display:inline-flex;align-items:center}
  .ph-btn{min-height:54px}

  /* USP Strip kompakt */
  .usp-strip-inner{grid-template-columns:1fr;gap:12px}
  .usp-item{padding-left:14px}

  /* Praxisfakten: Reihenfolge beibehalten, Signatur nach unten */
  .pf-raster{
    display:flex;
    flex-direction:column;
    gap:24px;
  }

  .pf-sig{
    border-top:none;
    padding-top:0;
    margin-top:2px;
    margin-left:20px;
    padding-bottom:20px;
    border-bottom:0.5px solid var(--rule);
  }

  .fisch-mob-badge{
    display:block !important;
    width:44px;height:44px;
    border-radius:50%;
    overflow:hidden;
    flex-shrink:0;
    border:1.5px solid rgba(217,115,82,0.20);
  }
  .fisch-mob-badge img{ width:100%;height:100%;object-fit:cover;display:block; }
  .hero-eyebrow-group{ display:flex;align-items:center;gap:10px;margin-bottom:10px; }
}

/* ── LANDSCAPE (Querformat) ≤ 900px Breite, ≤ 500px Höhe ── */
@media(orientation:landscape) and (max-width:900px) and (max-height:530px){
  /* body padding kleiner — mehr Platz zum Lesen */
  body{padding-bottom:0}

  /* Nav: auto-hide beim Scrollen (per JS gesteuert, Klasse .nav-landscape-hidden) */
  .haupt-nav{transition:transform .28s ease}
  .haupt-nav.nav-landscape-hidden{transform:translateY(-100%)}

  /* Hero: 2-spaltig im Querformat */
  .hero.hero-v2{display:grid;grid-template-columns:1fr 1fr}
  .hero-copy{order:1;padding:20px 24px 24px}
  .hero-v2 .hero-visual{order:2;display:block;min-height:auto}
  .hero-mob-visual{display:none}
  .hero-v2 .hero-h1{font-size:clamp(22px,4vw,32px);margin-bottom:8px}
  .hero-v2 .hero-sub{font-size:14px;margin-bottom:14px}
  .hero-v2 .hero-btns{flex-direction:row}
  .hero-v2 .hero-img-wrap{height:100%;position:absolute;inset:12px 12px 12px -16px}
  .hero-usp-badge,.welcome-badge{display:none}

  /* Haltung: 2-spaltig */
  

  /* Team-Grid: kleinere Karten */
  .team-grid .team-karte{flex:0 0 65vw}

  /* Sticky Bar: kleiner im Landscape */
  .sticky-bar-call,.dock-termin{min-height:48px;font-size:13px}

  /* Mob-Nav scrollbar im Landscape */
  .mob-nav{overflow-y:auto;-webkit-overflow-scrolling:touch}.gb-demo-bar{display:none !important}

  /* Sections: weniger Padding */
  .haltung,.team,.phasen,.digitalservices,.elternbereich,.kontakt{
    padding-top:clamp(32px,5vw,52px);
    padding-bottom:clamp(32px,5vw,52px);
  }
}

/* ── Portrait-spezifisch: ≤ 480px (kleine Smartphones) ── */
@media(max-width:480px){
  .pf-raster{grid-template-columns:1fr}
  /* hero-copy padding NICHT überschreiben — kommt aus dem 767px-Block */
}

/* ═══════════════════════════════════════════════
   MOBILE FIX v2 — Team · MFA · Footer · Landscape
   ═══════════════════════════════════════════════ */

/* ── Team-Karussell: saubere Basis ── */
@media(max-width:767px){
  /* Carousel reset (überschreibt altes grid) */
  .team-grid{
    display:flex !important;
    grid-template-columns:unset !important;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    gap:14px;
    padding:0 0 16px;
    scrollbar-width:none;
    /* Seitlicher Einzug damit erste Karte nicht klebt */
    margin-left:-22px;
    margin-right:-22px;
    padding-left:22px;
    padding-right:22px;
  }
  .team-grid::-webkit-scrollbar{display:none}
  .team-grid .team-karte{
    flex:0 0 82vw !important;
    max-width:320px;
    scroll-snap-align:start;
    min-width:0;
  }
  /* Team-Foto: Größe reduzieren damit es in die Karte passt */
  .team-foto{border-radius:14px !important}

/* ── Praxisgalerie ── */
.praxisgalerie{padding:clamp(60px,7vw,96px) var(--pad);background:var(--bg-soft);border-bottom:0.5px solid var(--rule)}
.praxis-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:clamp(18px,2.5vw,28px);margin-top:clamp(32px,4vw,48px)}
.praxis-karte{background:var(--white);border-radius:16px;border:1px solid var(--rule);overflow:hidden;display:flex;flex-direction:column;transition:transform 0.3s ease,box-shadow 0.3s ease}
.praxis-karte:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(28,43,51,0.05)}
.praxis-bild-wrap{width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--rule)}
.praxis-karte--gross .praxis-bild-wrap{aspect-ratio:16/11}
.praxis-bild-wrap img{width:100%;height:100%;object-fit:cover;transition:transform 0.5s ease}
.praxis-karte:hover .praxis-bild-wrap img{transform:scale(1.04)}
.praxis-caption{padding:20px;display:flex;flex-direction:column;gap:6px}
.praxis-caption strong{font-family:var(--head);font-size:18px;font-weight:400;color:var(--ink)}
.praxis-caption span{font-size:14px;color:var(--ink2);line-height:1.55;font-weight:300}

@media(max-width:1024px) and (orientation:portrait){
.wua-inner{grid-template-columns:1fr}
.wua-detail{width:32%;bottom:-14px;right:-10px}
.pe-grid{grid-template-columns:repeat(3,1fr)}
.btn-tel-hero{font-size:14px;padding:11px 16px}
}
@media(max-width:767px){
.wua-inner{grid-template-columns:1fr}
.wua-bild{margin-bottom:12px}
.wua-detail{width:30%;bottom:-12px;right:-8px}
.wua-h2{font-size:clamp(20px,5.5vw,28px)}
.pe-grid{grid-template-columns:repeat(3,1fr);gap:6px}
.hero-erst-besuch{flex-wrap:wrap;gap:6px}
.btn-tel-hero{font-size:14px;padding:12px 18px}
}
@media(max-width:480px){
.pe-grid{grid-template-columns:repeat(2,1fr)}
}

/* lv-strip: Leistungen-Vorschau unter Hero */
.lv-strip{background:var(--bg-soft);border-bottom:0.5px solid var(--border);padding:clamp(14px,1.8vw,22px) var(--pad)}
.lv-inner{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:clamp(12px,2vw,24px);flex-wrap:wrap}
.lv-label{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;flex-shrink:0}
.lv-chips{display:flex;gap:8px;flex-wrap:wrap}
.lv-chip{display:flex;flex-direction:column;background:#fff;border:0.5px solid var(--border);border-radius:10px;padding:9px 14px;text-decoration:none;transition:border-color .2s,box-shadow .2s;color:var(--ink)}
.lv-chip:hover{border-color:var(--primary);box-shadow:0 2px 10px rgba(27,72,90,.10)}
.lv-chip-name{font-size:13px;font-weight:600;color:var(--primary);line-height:1.3}
.lv-chip-sub{font-size:11px;color:var(--ink2);margin-top:2px;line-height:1.3}

/* srv-list — Online Eltern-Schalter */
.srv-list{display:flex;flex-direction:column;gap:8px;max-width:700px;margin:0 auto;text-align:left}
.srv-row{display:flex;align-items:center;gap:16px;padding:15px 20px;background:#fff;border:1px solid var(--border);border-left:3px solid transparent;border-radius:12px;cursor:pointer;transition:all .2s ease;text-decoration:none}
.srv-row:hover{border-color:#1B485A;border-left-color:var(--accent);box-shadow:0 4px 16px rgba(27,72,90,.09);transform:translateX(2px)}
.srv-row:hover .srv-arrow{transform:translateX(4px);color:var(--accent)}
.srv-row:hover .srv-ri{background:var(--primary,#1B485A)}
.srv-row:hover .srv-ri svg{stroke:#fff}
.srv-ri{width:42px;height:42px;border-radius:10px;background:#EEF5F3;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
.srv-ri svg{width:19px;height:19px;stroke:#6B8E85;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.srv-body{flex:1;min-width:0}
.srv-name{font-size:14px;font-weight:600;color:#2C4A56;margin-bottom:2px;transition:color .2s}
.srv-desc{font-size:12px;color:var(--ink2);line-height:1.4}
.srv-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.srv-tag{font-size:10px;font-weight:600;padding:3px 9px;border-radius:999px;background:#EEF5F3;color:#6B8E85;letter-spacing:.04em;white-space:nowrap}
.srv-tag.orange{background:#FDF0EB;color:var(--accent)}
.srv-arrow{color:#C8BDB5;font-size:20px;font-weight:300;transition:all .2s}
.srv-divider{height:1px;background:var(--border);margin:4px 0}
/* gs-modal */

#gs-overlay.aktiv{display:flex}
.gs-box{background:#fff;border-radius:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.18);display:flex;flex-direction:column}
.gs-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0;flex-shrink:0}
.gs-title{font-size:17px;font-weight:700;color:#1B485A}
.gs-close{background:none;border:none;cursor:pointer;font-size:22px;color:#aaa;line-height:1;padding:4px}
.gs-body{padding:20px 24px 0;flex:1}
.gs-body label{display:block;font-size:12px;font-weight:600;color:#6B8E85;letter-spacing:.04em;margin-bottom:5px;margin-top:14px;text-transform:uppercase}

.gs-body input:focus,.gs-body select:focus,.gs-body textarea:focus{border-color:#1B485A;background:#fff}
.gs-body textarea{resize:vertical;min-height:80px}
.gs-body .gs-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gs-body .gs-hint{font-size:12px;color:#9B9186;margin-top:6px;line-height:1.4}
.gs-foot{padding:20px 24px 24px;display:flex;gap:10px;flex-shrink:0}
.gs-btn-senden{flex:1;padding:13px;background:#1B485A;color:#fff;border:none;border-radius:999px;font-size:14px;font-weight:700;font-family:var(--body);cursor:pointer;transition:background .2s}
.gs-btn-senden:hover{background:#26607E}
.gs-hp{display:none!important}
.gs-danke{display:none;text-align:center;padding:32px 24px}
.gs-danke.aktiv{display:block}
.gs-danke-icon{width:56px;height:56px;border-radius:50%;background:var(--primary-lt);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.gs-danke h3{font-size:20px;font-weight:700;color:#1B485A;margin-bottom:8px}
.gs-danke p{font-size:14px;color:#9B9186;line-height:1.6}

/* Terminzettel-Karte */
.ft-zettel{position:fixed;left:18px;top:50%;transform:translateY(-50%) rotate(-1.5deg);z-index:290;width:188px;background:#FEFCF6;border-radius:3px 10px 10px 3px;box-shadow:2px 8px 28px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.08);pointer-events:none;opacity:0;transition:opacity .5s,transform .5s;border:0.5px solid rgba(0,0,0,.09)}
.ft-zettel.ft-sichtbar{opacity:1;pointer-events:all;transform:translateY(-50%) rotate(-1.5deg)}
.ft-zettel:hover{transform:translateY(-50%) rotate(0deg);box-shadow:3px 12px 36px rgba(0,0,0,.2)}
.ft-zettel-clip{position:absolute;top:-11px;left:50%;transform:translateX(-50%);width:28px;height:12px;background:#b0b8c1;border-radius:2px 2px 0 0;box-shadow:0 -1px 0 #8a9199}
.ft-zettel-clip::after{content:'';position:absolute;top:3px;left:4px;right:4px;height:6px;background:#d0d8df;border-radius:1px}
.ft-zettel-head{background:var(--accent);border-radius:3px 10px 0 0;padding:9px 14px 8px;display:flex;align-items:center;gap:8px}
.ft-zettel-head svg{color:#fff;flex-shrink:0;opacity:.9}
.ft-zettel-head-text{font-size:11px;font-weight:700;color:#fff;letter-spacing:.06em;text-transform:uppercase;line-height:1.2}
.ft-zettel-body{padding:10px 0 12px}
.ft-zettel-row{display:flex;align-items:center;gap:10px;padding:9px 14px;text-decoration:none;color:var(--ink);border-bottom:0.5px solid rgba(0,0,0,.06);position:relative;transition:background .15s}
.ft-zettel-row:last-child{border-bottom:none}
.ft-zettel-row:hover{background:rgba(0,0,0,.03)}
.ft-zettel-row:hover .ft-zettel-row-icon{transform:scale(1.08)}
.ft-zettel-row-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .2s}
.ft-zettel-row--termin .ft-zettel-row-icon{background:var(--accent);color:#fff}
.ft-zettel-row--video .ft-zettel-row-icon{background:var(--ink);color:#fff}
.ft-zettel-row-text{font-size:13px;font-weight:600;line-height:1.25;color:var(--ink)}
.ft-zettel-row-sub{font-size:10.5px;color:var(--ink2);font-weight:400;margin-top:1px}
.ft-zettel-lines{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.ft-zettel-lines::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(to bottom,transparent,transparent 28px,rgba(0,0,0,.04) 28px,rgba(0,0,0,.04) 29px)}
@media(max-width:767px){.ft-zettel{display:none}}

/* ── Termin-Wizard Modal ── */
body.gb-modal-open{overflow:hidden}
.gb-overlay{display:none;position:fixed;inset:0;z-index:8000;
  background:rgba(20,30,35,0.62);backdrop-filter:blur(5px);
  align-items:center;justify-content:center;padding:16px}
.gb-overlay.aktiv{display:flex}
.gb-box{background:#fff;border-radius:24px;width:100%;max-width:520px;
  max-height:92vh;display:flex;flex-direction:column;
  box-shadow:0 32px 80px rgba(28,45,55,0.22);overflow:hidden}
.gb-head{padding:22px 26px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.gb-step-lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:3px}
.gb-title{font-size:1.4rem;font-weight:700;color:var(--primary);margin:0;
  font-family:var(--kopf)}
.gb-close{position:absolute;top:18px;right:20px;background:none;border:none;
  cursor:pointer;color:var(--text-muted);font-size:1.4rem;
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;transition:background .2s}
.gb-close:hover{background:var(--border)}
.gb-head{position:relative}
.gb-dots{display:flex;gap:5px;margin-top:12px}
.gb-dot{height:4px;flex:1;border-radius:2px;background:var(--border);transition:background .35s}
.gb-dot.aktiv{background:var(--primary)}
.gb-dot.done{background:var(--sage)}
.gb-body{padding:22px 26px 20px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.gb-foot{padding:12px 26px 16px;border-top:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;background:#fff}
/* Radio-Karten */
.gb-radio-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.gb-radio-grid.single{grid-template-columns:1fr}
.gb-radio{border:1.5px solid var(--border);border-radius:14px;padding:12px 14px;
  cursor:pointer;display:flex;gap:10px;align-items:flex-start;
  transition:border-color .2s,background .2s;background:#fff}
.gb-radio:hover{border-color:var(--primary);background:var(--primary-lt)}
.gb-radio.gewaehlt{border-color:var(--primary);background:var(--primary-lt)}
.gb-radio-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);
  flex-shrink:0;margin-top:2px;transition:border-color .2s,background .2s}
.gb-radio.gewaehlt .gb-radio-dot{border-color:var(--primary);background:var(--primary)}
.gb-rlbl{font-size:.87rem;font-weight:600;color:var(--text)}
.gb-rdesc{font-size:.75rem;color:var(--text-muted);margin-top:2px}
.gb-intro{font-size:.85rem;font-weight:600;color:var(--text);margin-bottom:9px}
/* Slot-Grid */
.gb-slot-woche{margin-bottom:16px}
.gb-slot-woche-lbl{font-size:.7rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-muted);margin-bottom:7px}
.gb-slot-zeilen{display:flex;flex-wrap:wrap;gap:6px}
.gb-slot{padding:5px 13px;border:1.5px solid var(--border);border-radius:8px;
  font-size:.82rem;font-weight:600;cursor:pointer;transition:all .18s;
  background:#fff;color:var(--text)}
.gb-slot:hover{border-color:var(--primary);background:var(--primary-lt);color:var(--primary)}
.gb-slot.belegt{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.gb-slot.gewaehlt{border-color:var(--primary);background:var(--primary);color:#fff}
.gb-slot-hint{font-size:.73rem;color:var(--text-muted);margin-bottom:14px;
  background:var(--accent-lt);padding:8px 12px;border-radius:8px}
/* Formular */
.gb-form-row{margin-bottom:12px}
.gb-label{font-size:.78rem;font-weight:600;color:var(--text-muted);
  display:block;margin-bottom:4px;letter-spacing:.03em}
.gb-input{width:100%;padding:10px 13px;border:1.5px solid var(--border);
  border-radius:10px;font-size:.9rem;color:var(--text);
  font-family:var(--body);outline:none;transition:border-color .2s;background:#fff}
.gb-input:focus{border-color:var(--primary)}
.gb-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gb-dsgvo{display:flex;gap:10px;align-items:flex-start;margin-top:14px;
  font-size:.78rem;color:var(--text-muted);line-height:1.4}
.gb-dsgvo input{margin-top:2px;flex-shrink:0;accent-color:var(--primary)}
/* Anamnese */
.gb-anamnese-info{background:var(--sage-lt);border-radius:10px;padding:12px 14px;
  font-size:.78rem;color:var(--text-muted);margin-bottom:14px;line-height:1.5}
.gb-anamnese-info a{color:var(--primary)}
.gb-check-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.gb-check{display:flex;align-items:center;gap:7px;font-size:.82rem;
  padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer}
.gb-check input{accent-color:var(--primary)}
.gb-textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);
  border-radius:10px;font-size:.85rem;color:var(--text);
  font-family:var(--body);resize:vertical;min-height:62px;
  outline:none;transition:border-color .2s}
.gb-textarea:focus{border-color:var(--primary)}
.gb-skip-link{text-align:right;margin-bottom:8px}
.gb-skip-link button{background:none;border:none;cursor:pointer;
  font-size:.77rem;color:var(--text-muted);text-decoration:underline;
  font-family:var(--body);padding:0}
/* Danke-Screen */
.gb-danke{text-align:center;padding:28px 0 10px}
.gb-danke-icon{width:64px;height:64px;border-radius:50%;background:var(--primary-lt);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.gb-danke h3{font-size:1.3rem;font-weight:700;color:var(--primary);margin-bottom:8px}
.gb-danke p{font-size:.88rem;color:var(--text-muted);line-height:1.6;margin-bottom:18px}
.gb-danke-box{background:var(--primary-lt);border-radius:12px;padding:14px 16px;
  text-align:left;font-size:.82rem;color:var(--text)}
.gb-danke-box-row{display:flex;gap:8px;padding:4px 0;
  border-bottom:1px solid var(--border)}
.gb-danke-box-row:last-child{border-bottom:none}
.gb-danke-box-row span:first-child{color:var(--text-muted);min-width:100px}
/* Buttons */
.gb-btn-back{background:none;border:none;font-size:.87rem;cursor:pointer;
  color:var(--text-muted);padding:6px 10px;border-radius:8px;
  font-family:var(--body);display:flex;align-items:center;gap:4px}
.gb-btn-back:hover{background:var(--border)}
.gb-btn-next{background:var(--primary);color:#fff;border:none;
  padding:10px 22px;border-radius:10px;font-size:.9rem;font-weight:600;
  cursor:pointer;font-family:var(--body);transition:background .2s}
.gb-btn-next:hover{background:var(--primary-hover)}
.gb-btn-next:disabled{opacity:.5;cursor:not-allowed}
/* Demo-Buttons */
@media(max-width:1024px){.gb-demo-bar{display:none!important}}
.gb-demo-bar{position:fixed;bottom:20px;right:20px;z-index:7900;
  display:flex;flex-direction:column;gap:7px;align-items:flex-end;
  background:rgba(28,43,51,0.82);backdrop-filter:blur(8px);
  padding:10px 12px 10px;border-radius:14px;
  box-shadow:0 4px 20px rgba(0,0,0,.2)}
.gb-demo-label{font-size:.62rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:rgba(255,255,255,.7);text-align:right;
  margin-bottom:2px;padding-right:2px}
.gb-demo-btn{padding:9px 16px;border-radius:999px;border:none;cursor:pointer;
  font-size:.82rem;font-weight:700;font-family:var(--body);
  display:flex;align-items:center;gap:6px;
  box-shadow:0 4px 16px rgba(0,0,0,.15);transition:transform .15s,box-shadow .15s}
.gb-demo-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.gb-demo-btn.bestand{background:var(--primary);color:#fff}
.gb-demo-btn.neu{background:var(--accent);color:#fff}
/* Mobile */
@media(max-width:767px){
  .gb-overlay{padding:0;align-items:flex-end}
  .gb-box{border-radius:20px 20px 0 0;max-height:94vh;max-width:100%}
  .gb-radio-grid{grid-template-columns:1fr}
  .gb-row2{grid-template-columns:1fr}
  .gb-demo-bar{display:none !important}

.gb-sig-wrap{border:1.5px solid var(--border);border-radius:10px;
